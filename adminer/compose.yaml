# Use root/example as user/password credentials
# WARNING: for local testing only. As written, Adminer is published on port 8080 on
# every interface and the root password is "example", so anyone who can reach this
# host on port 8080 can log in to the database as root. Change the password and
# publish the port on localhost only (127.0.0.1:8080:8080) otherwise.

services:

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

  db:
    image: mysql:5.6
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example
